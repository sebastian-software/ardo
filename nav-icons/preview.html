<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ardo navigation icon review</title>
    <style>
      :root {
        color-scheme: light;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      body {
        margin: 24px;
        background: #f5f5f5;
        color: #222;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
        gap: 12px;
      }
      article {
        border: 1px solid #d4d4d4;
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
      }
      h2 {
        margin: 0;
        padding: 10px 12px;
        font-size: 14px;
      }
      .rows {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      .sample {
        min-height: 54px;
        display: grid;
        place-items: center;
        border-top: 1px solid #e5e5e5;
      }
      .sample:nth-child(even) {
        background: #1a1a1a;
        color: white;
      }
      .sample:nth-child(even) img {
        filter: invert(1);
      }
      .sample small {
        font-size: 10px;
        color: #888;
      }
      .sample:nth-child(even) small {
        color: #bbb;
      }
      .sample img {
        display: block;
        margin: 0 auto 3px;
      }
      .rotated img {
        transform: rotate(-90deg);
      }
    </style>
  </head>
  <body>
    <h1>Navigation icons</h1>
    <p>
      Core Line at 12 px and 14 px, upright and rotated −90°; each size is shown on light and dark
      backgrounds.
    </p>
    <main id="icons"></main>
    <script>
      const icons = [
        ["Guide", "guide", "Open Book"],
        ["Getting started", "getting-started", "Flag"],
        ["Concepts", "concepts", "Lightbulb"],
        ["How-to", "how-to", "List Checklist Task Done"],
        ["Reference", "reference", "Bookmark 2"],
        ["API", "api", "Curly Brackets"],
        ["CLI", "cli", "Browser Code 1"],
        ["Components", "components", "Layout Grid"],
        ["Examples", "examples", "Button Play"],
        ["Integrations", "integrations", "Connection Integration Plugin"],
        ["Architecture", "architecture", "Layers 3"],
        ["Decisions (ADRs)", "decisions", "Justice Scale 1"],
        ["Proposals (RFCs)", "proposals", "Chat Two Bubbles Square Text 2"],
        ["Performance", "performance", "Dashboard Gauge High 1"],
        ["Quality", "quality", "Shield Check"],
        ["Security", "security", "Padlock Square 1"],
        ["Operations", "operations", "Wrench"],
        ["Migration", "migration", "Folder Exchange"],
        ["Changelog", "changelog", "Reset Clock"],
        ["Archive", "archive", "Archive Box"],
      ]
      const variants = [
        [12, false],
        [12, true],
        [14, false],
        [14, true],
      ]
      const grid = document.querySelector("#icons")
      for (const [category, filename, streamlineName] of icons) {
        const card = document.createElement("article")
        const title = document.createElement("h2")
        title.textContent = `${category} · ${streamlineName}`
        card.append(title)
        const rows = document.createElement("div")
        rows.className = "rows"
        for (const [size, rotated] of variants) {
          for (const dark of [false, true]) {
            const sample = document.createElement("div")
            sample.className = `sample ${rotated ? "rotated" : ""}`
            sample.innerHTML = `<div><img src="${filename}.svg" width="${size}" height="${size}" alt=""><small>${size}px ${rotated ? "rotated" : "upright"}</small></div>`
            rows.append(sample)
          }
        }
        card.append(rows)
        grid.append(card)
      }
    </script>
  </body>
</html>
