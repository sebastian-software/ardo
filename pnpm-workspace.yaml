packages:
  - packages/*
  - docs
  - examples/*

overrides:
  eslint-plugin-oxlint: 1.77.0
  oxlint: 1.77.0

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "^10.0.0"

allowBuilds:
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - vite@8.0.16 || 8.2.1
  - "@storybook/addon-a11y@10.5.7"
  - "@storybook/addon-docs@10.5.7"
  - "@storybook/builder-vite@10.5.7"
  - "@storybook/csf-plugin@10.5.7"
  - "@storybook/react-dom-shim@10.5.7"
  - "@storybook/react-vite@10.5.7"
  - "@storybook/react@10.5.7"
  - lucide-react@1.29.0
  - storybook@10.5.7

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - unrs-resolver
