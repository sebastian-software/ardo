  - "@ferriki/win32-x64-msvc@1.1.2"
  - ferromark-darwin-arm64@3.5.1
  - ferromark-linux-arm64-gnu@3.5.1
  - ferromark-linux-arm64-musl@3.5.1
  - ferromark-linux-x64-gnu@3.5.1
  - ferromark-linux-x64-musl@3.5.1
  - ferromark-win32-arm64-msvc@3.5.1
