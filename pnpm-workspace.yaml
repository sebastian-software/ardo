  - "@typescript/typescript-darwin-x64@7.1.0-dev.20261011.1"
  - "@typescript/typescript-linux-arm@7.1.0-dev.20261011.1"
  - "@typescript/typescript-linux-arm64@7.1.0-dev.20261011.1"
  - "@typescript/typescript-linux-x64@7.1.0-dev.20261011.1"
  - "@typescript/typescript-win32-arm64@7.1.0-dev.20261011.1"
  - "@typescript/typescript-win32-x64@7.1.0-dev.20261011.1"
  - vite@8.0.16 || 8.2.1
  - "@storybook/addon-a11y@10.5.7"
  - "@storybook/addon-docs@10.5.7"
  - "@storybook/builder-vite@10.5.7"
  - "@storybook/csf-plugin@10.5.7"
  - "@storybook/react-dom-shim@10.5.7"
