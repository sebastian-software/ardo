name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  FERROLINK_VERSION: "0.1.0"

jobs:
  build:
    name: Build docs
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ardo package
        run: pnpm build

      - name: Build docs
        run: pnpm build
        working-directory: docs

      - name: Prepare GitHub Pages artifact
        run: pnpm docs:prepare-pages

      - name: Restore ferrolink ${{ env.FERROLINK_VERSION }}
        id: ferrolink-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ferrolink
          key: ferrolink-${{ env.FERROLINK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install ferrolink ${{ env.FERROLINK_VERSION }}
        if: steps.ferrolink-cache.outputs.cache-hit != 'true'
        run: cargo install --locked ferrolink --version "$FERROLINK_VERSION"

      # Same cross-version check as CI, so a broken artifact is never uploaded.
      # Archived v3–v5 pages are excluded as link sources; see ci.yml.
      - name: Check links across the GitHub Pages artifact
        run: pnpm docs:check-links

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/pages

  deploy:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
