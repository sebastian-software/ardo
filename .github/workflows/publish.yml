name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip actual publish)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3" # npm v11+ required for OIDC
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # For release events: only publish the package matching the tag
      - name: Publish ardo
        if: |
          (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'ardo-v')) ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: pnpm --filter ardo publish --access public --no-git-checks --provenance

      # Dry run (workflow_dispatch only)
      - name: Dry run ardo
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: pnpm --filter ardo publish --dry-run
