name: CI

on:
  push:
    branches: [main]
  # Stacked PRs need the same checks before their base merges.
  pull_request:

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Keep browser/system dependencies available when Ubuntu package mirrors fail.
    # Match the Playwright version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --shm-size=1gb
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Install native TypeScript for declaration documentation tests
        if: matrix.node-version == '24'
        run: npm install --prefix "$RUNNER_TEMP/ardo-native-ts" --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2

      - name: Test documentation from native TypeScript declarations
        if: matrix.node-version == '24'
        env:
          ARDO_DECLARATION_TSC: ${{ runner.temp }}/ardo-native-ts/node_modules/typescript/bin/tsc
        run: pnpm exec vitest --run packages/ardo/src/api --config vitest.config.ts

      - name: Run integration tests
        run: |
          if [ "${{ matrix.node-version }}" = "24" ]; then
            export ARDO_DECLARATION_TSC="$RUNNER_TEMP/ardo-native-ts/node_modules/typescript/bin/tsc"
          fi
          pnpm test:integration

      - name: Check documentation translations
        if: matrix.node-version == '24'
        run: pnpm --filter ardo-docs i18n:check

      - name: Build docs site and check performance budgets
        if: matrix.node-version == '24'
        run: pnpm docs:budgets

      - name: Validate complete GitHub Pages artifact
        if: matrix.node-version == '24'
        run: pnpm docs:prepare-pages

      - name: Run browser tests
        if: matrix.node-version == '24'
        env:
          ARDO_E2E_PREBUILT_DOCS: "true"
          ARDO_E2E_PAGES_ARTIFACT: "true"
        run: pnpm test:e2e

      - name: Verify live MDX and PO updates without hydration errors
        if: matrix.node-version == '24'
        run: pnpm test:e2e:docs-dev

      - name: Verify Basic and runtime fixture development and preview hydration
        if: matrix.node-version == '24'
        run: |
          pnpm test:e2e:examples
          ARDO_EXAMPLE_BROWSER_SERVER=preview pnpm test:e2e:examples
          pnpm test:e2e:recovery
