name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Diagnose OXC type resolution on failure
        if: failure() && matrix.node-version == '24'
        working-directory: packages/ardo
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          const require = createRequire(path.resolve('src/api/index.ts'));
          const ts = require('typescript');
          const config = ts.readConfigFile('tsconfig.json', ts.sys.readFile);
          const parsed = ts.parseJsonConfigFileContent(config.config, ts.sys, process.cwd());
          for (const file of ['src/api/comments.ts', 'src/vite/mdx-scope.ts']) {
            console.log(file, ts.resolveModuleName('oxc-parser', path.resolve(file), parsed.options, ts.sys));
          }
          const entry = require.resolve('oxc-parser');
          console.log({ entry, adjacentTypes: fs.existsSync(entry.replace(/\.js$/, '.d.ts')) });
          console.log(fs.readFileSync(path.resolve(path.dirname(entry), '../package.json'), 'utf8'));
          NODE

      - name: Lint
        run: pnpm lint

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Install native TypeScript for declaration documentation tests
        if: matrix.node-version == '24'
        run: npm install --prefix "$RUNNER_TEMP/ardo-native-ts" --no-package-lock --ignore-scripts --no-audit --no-fund typescript@7.0.2

      - name: Test documentation from native TypeScript declarations
        if: matrix.node-version == '24'
        env:
          ARDO_DECLARATION_TSC: ${{ runner.temp }}/ardo-native-ts/node_modules/typescript/bin/tsc
        run: pnpm exec vitest --run packages/ardo/src/api --config vitest.config.ts

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build docs site and check performance budgets
        if: matrix.node-version == '22'
        run: pnpm docs:budgets

      - name: Build examples
        if: matrix.node-version == '22'
        run: pnpm --filter './examples/*' build

      - name: Install Playwright browsers
        if: matrix.node-version == '22'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        if: matrix.node-version == '22'
        env:
          ARDO_E2E_PREBUILT_DOCS: "true"
        run: pnpm test:e2e

      - name: Build Storybook
        if: matrix.node-version == '22'
        run: pnpm storybook:build

      - name: Install Storybook Playwright browser
        if: matrix.node-version == '22'
        run: node scripts/install-storybook-playwright-browser.mjs

      - name: Run Storybook interaction tests
        if: matrix.node-version == '22'
        run: |
          pnpm storybook:build:test
          pnpm storybook:serve &
          pnpm exec wait-on http://localhost:6006
          pnpm storybook:test
