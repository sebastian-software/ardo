name: README

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readme:
    name: Generated README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: --locked
      - run: mise run readme:check
